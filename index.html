<!DOCTYPE html>
<html>
<head>
  <title>Website Abi 🔥</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      font-family: "Times New Roman", Times, serif;
      color: white;

      background: linear-gradient(-45deg, #000000, #1c1c1c, #2b2b2b);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 42px;
      letter-spacing: 2px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: white;
      color: black;
      transition: 0.3s;
    }

    button:hover {
      background: gray;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Abinaya web</h1>

  <button onclick="playMusic()">Play Musik 🎵</button>

  <audio id="bgMusic" loop>
    <source src="About you.mp3" type="audio/mpeg">
  </audio>

  <script>
    function playMusic() {
      document.getElementById("bgMusic").play();
    }
  </script>

</body>
</html>
